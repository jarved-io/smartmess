name: CI
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node scripts/check.js
      - run: npm test
  backend-postgres:           # same backend tests, against a real Postgres server through node-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: node --test test/backend.test.js
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          DATABASE_SSL: "off"
  ml:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ml } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: services/ml/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
